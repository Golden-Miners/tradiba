version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: distribution/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tradiba:tradiba@db:5432/tradiba
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend/apps/trader-terminal
      dockerfile: ../../../distribution/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - api

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=tradiba
      - POSTGRES_PASSWORD=tradiba
      - POSTGRES_DB=tradiba
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradiba"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
